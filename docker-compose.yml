version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:mysql://db:3306/agrisense?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=agrisense
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
